name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: brew install xcodegen
      - name: Build app
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./scripts/build-release.sh \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            PNGSMITH_UPDATE_FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" \
            PNGSMITH_SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: PNGSmith-unsigned
          path: dist/
      - name: Create signed update feed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo "Missing SPARKLE_PRIVATE_KEY repository secret" >&2; exit 1; }
          test -n "$SPARKLE_PUBLIC_KEY" || { echo "Missing SPARKLE_PUBLIC_KEY repository variable" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          updates="$RUNNER_TEMP/pngsmith-updates"
          sparkle="$RUNNER_TEMP/sparkle"
          mkdir -p "$updates" "$sparkle"
          ditto -c -k --keepParent dist/PNGSmith.app "$updates/PNGSmith-$version.zip"
          curl --fail --location \
            "https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz" \
            --output "$RUNNER_TEMP/Sparkle.tar.xz"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$sparkle" --strip-components=1
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$sparkle/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            "$updates"
          cp "$updates/appcast.xml" dist/appcast.xml
          cp "$updates/PNGSmith-$version.zip" dist/
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/PNGSmith-$version.zip" \
            dist/appcast.xml \
            --title "PNGSmith $version" \
            --generate-notes
