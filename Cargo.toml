[workspace]
members = [
    "crates/pngsmith-core",
    "crates/pngsmith-ffi",
    "crates/pngsmith-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
imagequant = "4.4"
oxipng = { version = "10.1.1", default-features = false, features = ["parallel", "zopfli"] }
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
